<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 人物模型展示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1b1931 0%, #08070d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: 10;
    }
    .hud h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .hud p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }
    .loading-tip {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
  <!-- 引入 Three.js 与 轨道控制器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="hud">
    <h1>3D 优雅人物演示</h1>
    <p>按住左键拖拽旋转视角 | 滚轮缩放 | 右键平移</p>
  </div>
  <div class="loading-tip">渲染引擎：Three.js PBR 材质与柔光管线</div>

  <div id="canvas-container"></div>

  <script>
    // --- 场景、相机与渲染器配置 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0e0d17, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // 轨道控制器
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.1, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.05; // 限制在地平线附近
    controls.minDistance = 1.5;
    controls.maxDistance = 6.0;

    // --- 灯光系统 (影视级三点光源 + 暖冷对比) ---
    const ambientLight = new THREE.AmbientLight(0x403b58, 0.8);
    scene.add(ambientLight);

    // 主光：柔和暖光
    const mainLight = new THREE.DirectionalLight(0xffecd2, 1.8);
    mainLight.position.set(2.5, 4.0, 3.0);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 10;
    mainLight.shadow.bias = -0.0005;
    scene.add(mainLight);

    // 轮廓光：亮粉紫色边缘光（勾勒发丝与身体线条）
    const rimLight = new THREE.DirectionalLight(0xd4
